<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for dynamic icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            padding: 20px;
            overflow-x: hidden;
        }

        /* Ambient background glow elements */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(99, 102, 241, 0.35);
            filter: blur(120px);
            border-radius: 50%;
            z-index: 0;
        }
        .glow-1 { top: 10%; left: 15%; }
        .glow-2 { bottom: 10%; right: 15%; background: rgba(236, 72, 153, 0.3); }

        .register-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Styling Django form fields dynamically */
        .form-group p {
            position: relative;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            text-transform: capitalize;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            background: #f8fafc;
            transition: all 0.25s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        /* Django help text styling */
        .form-group .helptext {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.4;
        }

        /* Django error list styling */
        .errorlist {
            list-style: none;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            border-radius: 8px;
            color: #991b1b;
            font-size: 0.85rem;
        }

        /* Password strength meter */
        .strength-meter {
            height: 4px;
            width: 100%;
            background: #e2e8f0;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 12px 20px -3px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="register-card">
        <div class="header">
            <h1>Create Account</h1>
            <p>Join us today! Enter your details below.</p>
        </div>

        <form method="POST" id="registerForm">
            {% csrf_token %}

            <div class="form-group">
                {{ form.as_p }}
            </div>

            <!-- Visual Password Strength Meter (Populated dynamically) -->
            <div class="strength-meter" id="meter">
                <div class="strength-bar" id="strengthBar"></div>
            </div>

            <button type="submit" class="submit-btn">
                <span>Get Started</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="footer">
            Already have an account? <a href="/accounts/login/">Log in</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInputs = document.querySelectorAll('input[type="password"]');
            const mainPassword = passwordInputs[0];
            const meter = document.getElementById('meter');
            const strengthBar = document.getElementById('strengthBar');

            // Interactive strength visualizer for the primary password field
            if (mainPassword) {
                mainPassword.addEventListener('input', (e) => {
                    const val = e.target.value;
                    if (val.length > 0) {
                        meter.style.display = 'block';
                        const score = calculateStrength(val);
                        
                        if (score < 2) {
                            strengthBar.style.width = '33%';
                            strengthBar.style.backgroundColor = '#ef4444';
                        } else if (score < 4) {
                            strengthBar.style.width = '66%';
                            strengthBar.style.backgroundColor = '#f59e0b';
                        } else {
                            strengthBar.style.width = '100%';
                            strengthBar.style.backgroundColor = '#10b981';
                        }
                    } else {
                        meter.style.display = 'none';
                    }
                });
            }

            function calculateStrength(pwd) {
                let score = 0;
                if (pwd.length > 7) score++;
                if (/[A-Z]/.test(pwd)) score++;
                if (/[0-9]/.test(pwd)) score++;
                if (/[^A-Za-z0-9]/.test(pwd)) score++;
                return score;
            }
        });
    </script>
</body>
</html>
