<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Trade #{{ trade.id }}</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 27, 45, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-glow: rgba(239, 68, 68, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-link {
            text-decoration: none;
        }

        /* MAIN WRAPPER */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px var(--glass-glow);
            text-align: center;
        }

        .icon-badge {
            width: 56px;
            height: 56px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: var(--accent-red);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .confirmation-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        /* TRADE DETAILS PREVIEW BOX */
        .trade-summary {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .summary-item label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .summary-item span {
            font-size: 1rem;
            font-weight: 700;
        }

        .pnl-positive {
            color: var(--accent-green);
        }

        .pnl-negative {
            color: var(--accent-red);
        }

        /* BUTTON ACTIONS */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-delete {
            width: 100%;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-delete:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
            transform: translateY(-1px);
        }

        .btn-delete:active {
            transform: translateY(1px);
        }

        .btn-cancel {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* FOOTER */
        footer {
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid var(--card-border);
            padding: 20px 32px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header>
    <a href="{% url 'trade_list' %}" class="brand-link">
        <div class="brand">
            <i data-lucide="candlestick-chart"></i>
            <span>TradeTracker</span>
        </div>
    </a>
</header>

<!-- MAIN CONTENT -->
<main>
    <div class="card">
        <div class="icon-badge">
            <i data-lucide="alert-triangle" style="width: 28px; height: 28px;"></i>
        </div>

        <h1>Delete Trade #{{ trade.id }}</h1>
        <p class="confirmation-text">Are you sure you want to delete this trade record? This action cannot be undone.</p>

        <!-- TRADE SUMMARY DETAILS -->
        <div class="trade-summary">
            <div class="summary-item">
                <label>Symbol</label>
                <span>{{ trade.entry_symbol }}</span>
            </div>
            <div class="summary-item">
                <label>Side</label>
                <span>{{ trade.entry_side }}</span>
            </div>
            <div class="summary-item">
                <label>PnL</label>
                <span class="{% if trade.pnl >= 0 %}pnl-positive{% else %}pnl-negative{% endif %}">
                    {{ trade.pnl }}
                </span>
            </div>
        </div>

        <!-- FORM & ACTIONS -->
        <form method="POST" class="action-group">
            {% csrf_token %}

            <button type="submit" class="btn-delete">
                <i data-lucide="trash-2" style="width: 18px; height: 18px;"></i>
                Yes, Delete Trade
            </button>

            <a href="{% url 'trade_list' %}" class="btn-cancel">
                Cancel
            </a>
        </form>
    </div>
</main>

<!-- FOOTER -->
<footer>
    <p>&copy; {% now "Y" %} Quantitative Trading Journal &bull; Built with Django</p>
</footer>

<script>
    lucide.createIcons();
</script>

</body>
</html>
