<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Trade #{{ trade.id }}</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 27, 45, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --focus-ring: rgba(56, 189, 248, 0.3);
            --glass-glow: rgba(56, 189, 248, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-link {
            text-decoration: none;
        }

        /* MAIN WRAPPER */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px var(--glass-glow);
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.12);
        }

        .header-title {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-title h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 6px;
        }

        /* STYLING DJANGO FORM FIELDS */
        form p {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        form label {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
        }

        form input, form select, form textarea {
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        form input:focus, form select:focus, form textarea:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px var(--focus-ring);
            background: rgba(11, 15, 25, 0.85);
        }

        /* BUTTON ACTIONS */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-update {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-update:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
            transform: translateY(-1px);
        }

        .btn-update:active {
            transform: translateY(1px);
        }

        .btn-cancel {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* FOOTER */
        footer {
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid var(--card-border);
            padding: 20px 32px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header>
    <a href="{% url 'trade_list' %}" class="brand-link">
        <div class="brand">
            <i data-lucide="candlestick-chart"></i>
            <span>TradeTracker</span>
        </div>
    </a>
</header>

<!-- MAIN CONTENT -->
<main>
    <div class="card">
        <div class="header-title">
            <h1>Update Trade #{{ trade.id }}</h1>
            <p>Modify parameters for trade record execution</p>
        </div>

        <form method="POST" id="updateTradeForm">
            {% csrf_token %}
            
            {{ form.as_p }}

            <div class="action-group">
                <button type="submit" class="btn-update" id="submitBtn">
                    <span class="spinner" id="btnSpinner"></span>
                    <i data-lucide="edit-3" id="btnIcon" style="width: 18px; height: 18px;"></i>
                    <span id="btnText">Update Trade</span>
                </button>

                <a href="{% url 'trade_list' %}" class="btn-cancel">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</main>

<!-- FOOTER -->
<footer>
    <p>&copy; {% now "Y" %} Quantitative Trading Journal &bull; Built with Django</p>
</footer>

<script>
    lucide.createIcons();

    const form = document.getElementById('updateTradeForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');

    // Loading state micro-interaction
    form.addEventListener('submit', function () {
        submitBtn.style.opacity = '0.75';
        submitBtn.style.pointerEvents = 'none';
        btnIcon.style.display = 'none';
        btnSpinner.style.display = 'inline-block';
        btnText.textContent = 'Updating...';
    });

    // Dynamic field label highlights on focus
    document.querySelectorAll('form input, form select, form textarea').forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.querySelector('label')?.style.setProperty('color', '#38bdf8');
        });
        input.addEventListener('blur', () => {
            input.parentElement.querySelector('label')?.style.setProperty('color', '#94a3b8');
        });
    });
</script>

</body>
</html>
